stonecutter {
	replacements.string(current.parsed >= "1.21.11") {
		replace("ResourceLocation", "Identifier")
		replace(".location()", ".identifier()")
	}
}

processResources {
	if (stonecutter.compare(stonecutter.current.version, "1.21.8") <= 0) {
		fletchingTable.relocate(it, "assets/${prop("data.mod_id")}/spawn_areas_1_21_8/*.png -> ../spawn_areas")
	} else {
		exclude("assets/${prop("data.mod_id")}/spawn_areas_1_21_8/")
	}
}

configurations.forEach {
	it.resolutionStrategy {
		cacheChangingModulesFor(0, 'seconds')
	}
}

String prop(String key) {
	return findProperty(key).toString()
}
