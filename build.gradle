plugins {
	id "net.lopymine.mossy-plugin-core" version "$mossy_plugin_version"
	id "maven-publish"
}

mossyDependencies {
	minecraft = stonecutter.current.project.substring(stonecutter.current.project.indexOf("-") + 1)
	lombok = prop("base.lombok_version")

	fabricApi = prop("build.fabric_api")
	fabricLoader = prop("build.fabric_loader")

	forge = prop("build.forge")

	neoForge = prop("build.neoforge")
	parchment = prop("build.parchment")

	additional {
//		if (stonecutter.compare(stonecutter.current.version, "1.21.11") >= 0) {
//			disable("mossylib")
//		}
 		if (stonecutter.current.version.startsWith("26.1")) {
			disable("mossylib")
		}
	}
}

repositories {
	mavenLocal()
	maven {
		name "Mossy Projects"
		url "https://maven.lopymine.net/releases"
	}
}

dependencies {
//	if (stonecutter.compare(stonecutter.current.version, "1.21.11") >= 0) {
//		def project = stonecutter.current.project
//		if (project.contains("neoforge")) {
//			jarJar(implementation("net.lopymine:mossylib:1.0.5-${project}"))
//		} else {
//			include(modImplementation("net.lopymine:mossylib:1.0.5-${project}"))
//		}
//	}
	def project = stonecutter.current.project
	if (project.contains("26.1")) {
		if (project.contains("neoforge")) {
			jarJar(implementation("net.lopymine:mossylib:1.1.0-neoforge-26.1-pre-2"))
		} else {
			include(implementation("net.lopymine:mossylib:1.1.0-fabric-26.1-pre-2"))
		}
	}
}

stonecutter {
	replacements.string(current.parsed >= "1.21.11") {
		replace("TagKey::location", "TagKey::location")
	}
}

stonecutter {
	replacements.string(current.parsed >= "26.1") {
		replace("net.minecraft.client.gui.GuiGraphics", "net.minecraft.client.gui.GuiGraphicsExtractor")
		replace("GuiGraphics", "GuiGraphicsExtractor")
		replace("context.drawString(", "context.text(")
		replace("context.renderItem(", "context.item(")
		replace("graphics.drawString(", "graphics.text(")
		replace("graphics.renderItem(", "graphics.item(")
		replace("ClickType", "ContainerInput")
	}
}

processResources {
	if (stonecutter.compare(stonecutter.current.version, "1.21.8") <= 0) {
		fletchingTable.relocate(it, "assets/${prop("data.mod_id")}/spawn_areas_1_21_8/*.png -> ../spawn_areas")
	} else {
		exclude("assets/${prop("data.mod_id")}/spawn_areas_1_21_8/")
	}
}

publishing {
	repositories {
		maven {
			name = 'MossyProjectsReleases'
			url = uri('https://maven.lopymine.net/releases')
			credentials(PasswordCredentials)
			authentication {
				create('basic', BasicAuthentication)
			}
		}
		mavenLocal()
	}

	publications {
		mossyPlugin(MavenPublication) {
			groupId = "${prop("data.mod_maven_group")}"
			artifactId = prop("data.mod_id")
			version = "${prop("data.mod_version")}-${stonecutter.current.project}"
			from components.java
		}
	}
}

configurations.forEach {
	it.resolutionStrategy {
		cacheChangingModulesFor(0, 'seconds')
	}
}

String prop(String key) {
	return findProperty(key).toString()
}